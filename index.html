<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackbody Scientific OLED Wallpapers</title>

<style>
/* Every surface is #000, the colour the wallpapers are made of; no near-black panels (OLED shows them
   as blotchy grey). Titles in tracked Verdana capitals, as on the wallpapers' own title blocks. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --ink: #F1ECE2;
  --title: #D9D4CB;
  --muted: #8F8A83;
  --dim: #66625C;
  --rule: #211F1D;
  --frame: #181715;
  --sans: Verdana, "DejaVu Sans", Tahoma, Geneva, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --gutter: clamp(16px, 4vw, 56px);
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--muted); font: 400 13px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.wrap { max-width: 1680px; margin-inline: auto; padding-inline: var(--gutter); }
.caps { margin: 0; font-weight: 400; font-size: 11.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--title); }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding-block: 32px 0; }
.top h1 { font-size: 13px; letter-spacing: 0.45em; color: var(--ink); }
.top p { margin: 0; color: var(--dim); }
.top .tag { margin-top: 12px; color: var(--muted); }
.top .by { margin-top: 6px; font-size: 12px; color: var(--dim); }
.top .by a { color: var(--muted); }

main { padding-bottom: 80px; container-type: inline-size; }
/* One grid for every theme, so small themes share rows and no cell is left empty. Each theme's name heads
   its first picture from the row gap above it; with a single column it sits in the flow instead. */
.grid { display: grid; gap: 52px 24px; padding-top: 72px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > h2 { position: absolute; left: 0; right: 0; bottom: calc(100% + 10px); padding-bottom: 7px; border-bottom: 1px solid var(--rule); color: var(--ink); line-height: 1.3; }
@container (max-width: 743.9px) {
  .grid { gap: 36px; padding-top: 36px; }
  .card > h2 { position: static; margin-top: 12px; }
}
.shot { display: block; width: 100%; }
.shot img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; outline: 1px solid var(--frame); transition: outline-color 0.2s; }
.shot:hover img { outline-color: var(--dim); }
.row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.dls { display: flex; gap: 16px; }
.dls a { color: var(--muted); text-decoration: none; }
.dls a:hover { color: var(--ink); }
a.busy { opacity: 0.5; pointer-events: none; }

/* detail view */
.lb { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
.lb-stage { min-width: 0; min-height: 0; display: grid; place-items: center; padding: clamp(12px, 3vw, 40px); }
.lb-stage img { max-width: 100%; max-height: 100%; outline: 1px solid var(--frame); }
.lb-info { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lb-bar .nav { display: flex; gap: 6px; }
.btn { display: inline-flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--rule); color: var(--title); text-decoration: none; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; transition: border-color 0.15s, color 0.15s; }
.btn:hover { border-color: var(--muted); color: var(--ink); }
.lb-title { margin-top: 8px; font-size: 12.5px; color: var(--ink); }
.lb-cap { margin: 0; }
.lb-dl { display: flex; flex-direction: column; gap: 8px; }
.lb-dl .mono { color: var(--dim); font-size: 11.5px; letter-spacing: 0; text-transform: none; }
.note { margin: 0; min-height: 1.6em; color: var(--muted); }
.lic { margin: 0; color: var(--dim); font-size: 11px; }
.src { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--dim); font-size: 11px; }

@media (max-width: 860px) {
  .lb { grid-template-columns: minmax(0, 1fr); overflow-y: auto; align-content: start; }
  .lb-stage { padding: 12px 0 0; }
  .lb-stage img { width: 100%; max-height: none; }
  .lb-info { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; padding-inline: 16px; }
  .lb-bar { order: -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {

  var D = JSON.parse(document.getElementById("data").textContent);

  }
  function mb(b) { return (b / 1048576).toFixed(1) + " MB"; }

    meta.appendChild(document.createTextNode(" · "));
    meta.appendChild(lic);
  }

  /* ---- downloads ---- */
  // Inside the claude.ai viewer a page can't start a download itself; the `downloads` capability asks
  // the viewer to save the file. Opened locally, the links just work.
  var saver = null;
  if (window.claude && typeof window.claude.use === "function") {
    setTimeout(function () {
      window.claude.use("downloads").then(function (ns) { saver = ns || null; }, function () { saver = null; });
    }, 0);
  }
  function dlLink(f, big) {
    var a = el("a", big ? "btn" : null);
    a.href = f.href;
    a.setAttribute("download", f.name);
    a.target = "_blank";
    a.rel = "noopener";
    a.dataset.dl = "1";
    a.dataset.name = f.name;
    a.title = "PNG, " + f.w + " × " + f.h + ", " + mb(f.bytes);
    if (big) {
      a.appendChild(el("span", null, "Download " + f.label));
      a.appendChild(el("span", "mono", f.w + " × " + f.h + " · " + mb(f.bytes)));
    } else {
      a.textContent = "↓ " + f.label;
    }
    return a;
  }
  var note = document.getElementById("lb-note");
  function say(msg, href) {
    note.textContent = msg || "";
    if (href) {
      var o = el("a", null, "Open the file");
      o.href = href; o.target = "_blank"; o.rel = "noopener";
      note.appendChild(document.createTextNode(" "));
      note.appendChild(o);
    }
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("a[data-dl]") : null;
    if (!a || !saver) return;           // no capability: the link opens the file
    ev.preventDefault();
    if (a.classList.contains("busy")) return;
    a.classList.add("busy");
    fetch(a.href).then(function (r) {
      if (!r.ok) throw { code: "fetch" };
      return r.blob();
    }).then(function (blob) {
      return saver.save({ filename: a.dataset.name, data: blob });
    }).then(function () {
      say("Saved " + a.dataset.name);

      var code = err && err.code;

  });

  /* ---- gallery ---- */
  // One grid for every theme, in order, so small themes share rows; a theme's name heads its first card.
  var gallery = document.getElementById("gallery");
  var grid = el("div", "grid");
  var order = [];
  D.themes.forEach(function (t) {
    items.filter(function (i) { return i.theme === t.key; }).forEach(function (it, k) {
      order.push(it.id);
      var card = el("article", "card");
      if (k === 0) card.appendChild(el("h2", "caps", t.label));
      var shot = el("button", "shot");
      shot.type = "button";
      shot.setAttribute("aria-label", "Open " + it.title);
      var img = el("img");
      img.src = it.card;
      img.width = 960; img.height = 540;
      img.alt = it.title;
      img.decoding = "async";
      if (order.length > 6) img.loading = "lazy";
      shot.appendChild(img);
      shot.addEventListener("click", function () { openLb(it.id); });
      card.appendChild(shot);
      var row = el("div", "row");
      row.appendChild(el("h3", "caps", it.title));
      var dls = el("div", "dls mono");
      it.files.forEach(function (f) { if (f.href) dls.appendChild(dlLink(f, false)); });
      row.appendChild(dls);
      card.appendChild(row);
      grid.appendChild(card);
    });
  });
  gallery.appendChild(grid);

  /* ---- detail view ---- */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lb-img");
  var pos = 0, opener = null;
  function fill() {
    var it = byId[order[pos]];
    lbImg.src = it.img;
    lbImg.alt = it.title;
    document.getElementById("lb-count").textContent = (pos + 1) + " / " + order.length;
    document.getElementById("lb-title").textContent = it.title;
    var cap = document.getElementById("lb-cap");
    cap.textContent = it.caption || "";
    cap.hidden = !it.caption;
    var dl = document.getElementById("lb-dl");
    dl.textContent = "";
    it.files.forEach(function (f) { if (f.href) dl.appendChild(dlLink(f, true)); });
    dl.hidden = !dl.firstChild;
    var lic = document.getElementById("lb-lic");
    lic.textContent = "";
    if (it.licence && it.licence.name) {
      var la = el("a", null, it.licence.name);
      la.href = it.licence.url; la.target = "_blank"; la.rel = "noopener";
      lic.appendChild(la);
      if (D.licence && D.licence.credit) lic.appendChild(document.createTextNode(" · credit “" + D.licence.credit + "”"));
    }
    lic.hidden = !lic.firstChild;
    say("");
    var ul = document.getElementById("lb-src");
    ul.textContent = "";
    it.credits.forEach(function (c) {
      var li = el("li");
      if (c.url) {
        var a = el("a", null, c.source);
        a.href = c.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.textContent = c.source;
      }
      if (c.license) li.appendChild(document.createTextNode(" · " + c.license));
      ul.appendChild(li);
    });
    ul.hidden = !it.credits.length;
  }
  function openLb(id) {
    pos = Math.max(0, order.indexOf(id));
    opener = document.activeElement;
    fill();
    lb.hidden = false;
    document.documentElement.style.overflow = "hidden";
    document.getElementById("lb-close").focus();
  }
  function closeLb() {
    lb.hidden = true;
    document.documentElement.style.overflow = "";
    lbImg.removeAttribute("src");
    if (opener && opener.focus) opener.focus();
  }
  function step(d) { pos = (pos + d + order.length) % order.length; fill(); }
  document.getElementById("lb-close").addEventListener("click", closeLb);
  document.getElementById("lb-prev").addEventListener("click", function () { step(-1); });
  document.getElementById("lb-next").addEventListener("click", function () { step(1); });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); closeLb(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "Tab") {
      var f = lb.querySelectorAll("button, a[href]");
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>

</body>
</html>
